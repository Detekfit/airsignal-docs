<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body style="margin:0;background:#0a0a0a;font-family:Poppins,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;">Your AirSignal reset code is {{ .Token }}</div>
    <div style="margin:0 auto;max-width:480px;padding:40px 24px;">
      <p style="margin:0 0 24px;color:#fafafa;font-size:18px;font-weight:600;letter-spacing:-0.02em;">airsignal</p>
      <h1 style="margin:0 0 16px;color:#fafafa;font-size:24px;font-weight:600;line-height:1.3;">Reset your password</h1>
      <p style="margin:0 0 16px;color:#a3a3a3;font-size:15px;line-height:1.6;">
        Use this code to reset the password for
        <span style="color:#fafafa;">{{ .Email }}</span>.
      </p>
      <div style="margin:24px 0;border-radius:12px;background:#171717;padding:20px;text-align:center;">
        <p style="margin:0;color:#fafafa;font-size:32px;font-weight:600;letter-spacing:0.28em;">{{ .Token }}</p>
      </div>
      <hr style="border:none;border-top:1px solid #262626;margin:24px 0;" />
      <p style="margin:0;color:#737373;font-size:13px;line-height:1.5;">If you did not request this, you can ignore this email.</p>
    </div>
  </body>
</html>
